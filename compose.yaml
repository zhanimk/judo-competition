name: judo-competition
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: judo_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a private PostgreSQL admin password}
      POSTGRES_DB: judo_competition
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set a private application database password}
    volumes:
      - database:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/010-application-role.sh:ro
    networks: [backend]
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U judo_admin -d judo_competition']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a private Redis password}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis:/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    image: judo-api:${JUDO_IMAGE_TAG:-local}
    build: { context: ., target: api }
    command: [node, scripts/deploy-migrations.mjs]
    environment:
      DATABASE_URL: postgresql://judo_app:${APP_DATABASE_PASSWORD:?}@postgres:5432/judo_competition?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: 'no'
    logging: *logging

  api:
    image: judo-api:${JUDO_IMAGE_TAG:-local}
    build: { context: ., target: api }
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_REPLICAS: '1'
      PORT: '4319'
      TRUST_PROXY: '1'
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set the exact public HTTPS origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgresql://judo_app:${APP_DATABASE_PASSWORD:?}@postgres:5432/judo_competition?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, frontend]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:4319/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
    logging: *logging

  web:
    image: judo-web:${JUDO_IMAGE_TAG:-local}
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4319
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4319
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:4318/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 4s
      retries: 6
    logging: *logging

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
    networks: [frontend]
    logging: *logging

  backup:
    profiles: [operations]
    image: judo-operations:${JUDO_IMAGE_TAG:-local}
    build: { context: ., target: operations }
    # Private file-based Compose secrets retain their host UID/mode. Only this one-shot job needs root.
    user: '0:0'
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://judo_admin:${POSTGRES_ADMIN_PASSWORD:?}@postgres:5432/judo_competition?schema=public
      BACKUP_OUTPUT_ROOT: /backups
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    secrets: [backup_encryption_key]
    volumes: [backups:/backups]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  backend:
    internal: true
  frontend: {}
volumes:
  database: {}
  redis: {}
  backups: {}
secrets:
  backup_encryption_key:
    file: ${BACKUP_ENCRYPTION_KEY_SOURCE:-./deploy/secrets/backup.key}
