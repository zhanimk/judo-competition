# Free preview infrastructure. PostgreSQL expires after 30 days.
services:
  - type: web
    name: judo-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @judo/engine && npm run build -w @judo/api
    startCommand: node scripts/deploy-migrations.mjs && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_REPLICAS
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: judo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: judo-redis
          type: keyvalue
          property: connectionString
  - type: keyvalue
    name: judo-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
databases:
  - name: judo-db
    plan: free
    region: frankfurt
    databaseName: judo
    user: judo
    ipAllowList: []
